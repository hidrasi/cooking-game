<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Dapur Kilat — Cooking Game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b1d12;
    height: 100%;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #f7ead2;
    border-radius: 10px;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55);
    max-width: 100vw;
    max-height: 100vh;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 8px;
    transform: translateX(-50%);
    color: #d8c3a5;
    font-size: 12px;
    letter-spacing: 0.4px;
    opacity: 0.85;
    user-select: none;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1024" height="640"></canvas></div>
<div id="hint">WASD / Panah: bergerak &nbsp;•&nbsp; E / Spasi: ambil &amp; letak &nbsp;•&nbsp; Klik: jalan ke titik &nbsp;•&nbsp; P: jeda &nbsp;•&nbsp; M: suara</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
